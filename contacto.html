<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoUTN - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/contacto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* Hacemos que el main ocupe todo el espacio y quitamos el padding */
        .main-content.full-screen {
            padding: 0;
            gap: 0;
        }

        /* Estilos para la nueva página de contacto combinada */
        .contact-page-container {
            display: flex;
            flex-wrap: wrap; /* Permite que los elementos se apilen en pantallas pequeñas */
            width: 100%;
        }

        .map-column, .form-column {
            flex: 1; /* Cada columna toma el 50% del espacio */
            min-width: 300px; /* Ancho mínimo para evitar que se aplasten demasiado */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch; /* Hacemos que los hijos se estiren */
            padding: 2rem; /* Añadimos padding interno para que el contenido no se pegue a los bordes */
        }

        .form-column {
            /* Centramos el contenido de la columna del formulario */
            align-items: center;
        }

        .map-column {
            /* Aseguramos que el contenido del mapa se centre y crezca */
            align-items: center;
        }

        .map-container {
            flex-grow: 1; /* Permite que este div crezca y ocupe el espacio vertical */
            width: 100%;
        }

        .map-container iframe {
            width: 100%;
            height: 100%; /* Hacemos que el mapa ocupe toda la altura de su columna */
            border: 0;
            border-radius: 8px;
        }
        .address-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 1.1rem;
            color: #555;
        }
        
        .form-column .contact-form {
            width: 100%; /* Hacemos que el formulario ocupe todo el ancho de su columna */
            display: flex; /* Habilitamos flexbox para centrar su contenido */
            flex-direction: column; /* Apilamos los elementos del formulario verticalmente */
            flex-grow: 1; /* Hacemos que el formulario crezca para ocupar el espacio vertical */
        }

        /* En pantallas pequeñas, el mapa no debe ser tan alto */
        @media (max-width: 768px) {
            .map-container iframe { height: 400px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.png" alt="Logo AutoUTN">
            </a>
        </div>
        <nav class="nav">
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reserva.html">Reserva</a></li>
                <li><a href="mis-autos.html">Mis Autos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="registro.html" class="btn-login">Registrarse</a>
        </div>
        <button class="hamburger" aria-label="Abrir menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <main class="main-content full-screen">
        <div class="contact-page-container">
            <!-- Columna del Mapa -->
            <div class="map-column">
                <h2>Nuestra Ubicación</h2>
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3282.5647439257086!2d-58.60793981076373!3d-34.64043798965808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcb881cd11a159%3A0x3c6312efcfe9783f!2sLos%20Andes%202054%2C%20B1706BSH%20Haedo%2C%20Provincia%20de%20Buenos%20Aires!5e0!3m2!1ses-419!2sar!4v1760655083756!5m2!1ses-419!2sar" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de ubicación de AutoUTN en Haedo"></iframe>
                </div>
                <p class="address-text">Los Andes 2054, Haedo, Provincia de Buenos Aires</p>
            </div>

            <!-- Columna del Formulario -->
            <div class="form-column">
                <form id="contact-form" class="contact-form">
                    <h2>Envíanos un mensaje</h2>
                    <div class="form-group">
                        <label for="email-contacto">Tu Email</label>
                        <input type="email" id="email-contacto" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="subject">Tema</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Selecciona un tema...</option>
                            <option value="consulta">Consulta General</option>
                            <option value="cuenta">Problemas con mi cuenta</option>
                            <option value="sugerencia">Sugerencias</option>
                            <option value="error">Reportar un error</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Enviar</button>
                </form>
                <div id="success-message" class="success-message">
                    ¡Mensaje enviado correctamente!
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="legal">
            <p>&copy; 2025 AutoUTN. Todos los derechos reservados. Legales.</p>
        </div>
        <div class="social-icons">
            <a href="https://frh.utn.edu.ar/" target="_blank" rel="noopener noreferrer" aria-label="Sitio Web"><i class="fas fa-globe"></i></a>
            <a href="https://www.instagram.com/utn.frh/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.linkedin.com/school/utn-facultad-regional-haedo/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.youtube.com/@facultadregionalhaedo-utn3647" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <!-- <script src="js/contacto.js"></script> -->
    <!-- El script de contacto.js se puede crear más adelante cuando se haga funcional el formulario -->
</body>
</html>
